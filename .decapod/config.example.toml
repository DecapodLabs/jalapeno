schema_version = "1.0.0"

[context]
declared_sources = []

[custody]
isolation = "worktree"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = false
diagram_style = "ascii"
entrypoints = ["AGENTS.md"]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
args = ["scripts/check.py"]
command = "python3"
description = "Guided init proof command 1"
name = "rust"
required = true

[repo]
architecture_direction = "Initial dependency-free Rust CLI; planned engine-independent synthesis core with thin adapters."
backend = "local"
base_branch = "main"
container_workspaces = false
declared_capabilities = [
    "event-driven",
    "infrastructure-management",
    "persistent-state",
    "public-api",
]
done_criteria = "Minimal CLI help/version and usage errors pass smoke checks; specs account for the full original brief as future work."
external_tracker = false
primary_languages = ["rust"]
product_name = "Jalapeño"
product_summary = "Standalone deterministic procedural audiovisual synthesis toolkit"
product_type = "service_or_library"

[tracker]
provider = "decapod"
