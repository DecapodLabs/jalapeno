schema_version = "1.0.0"

[context]
declared_sources = []

[custody]
isolation = "worktree"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = false
diagram_style = "ascii"
entrypoints = ["AGENTS.md", "CLAUDE.md", "CODEX.md", "GEMINI.md"]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
args = ["scripts/check.py"]
command = "python3"
description = "Formatting, lint, mathematical tests and decoded tone/icon export smoke checks"
name = "rust"
required = true

[repo]
architecture_direction = "Dependency-free Rust core for additive tone/WAV and harmonic icon/SVG generation; thin CLI, larger toolkit remains planned."
backend = "local"
base_branch = "main"
container_workspaces = false
declared_capabilities = []
done_criteria = "Tone/WAV and icon/SVG paths work through a reusable core; decoded export, numerical and CLI checks pass; specs distinguish current scope from roadmap."
external_tracker = false
primary_languages = ["rust"]
product_name = "jalapeno"
product_summary = "Standalone deterministic procedural audiovisual synthesis toolkit"
product_type = "service_or_library"

[tracker]
provider = "decapod"

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:b77f07b12b3a066c36ced77e85b6d4e8ddabb87e2f1b62a447feb74cdd41a3eb"

[proof.repository_contract]
reviewed_commands_digest = "sha256:e2d3fd41d5cff855960bfe43171e6b46daffff647f37eba7873dcd64120b36e9"
source_coverage = [
  { source = ".github/workflows/ci.yml", commands = ["rust"] },
  { source = ".github/workflows/decapod-validate.yml", commands = ["rust"] },
  { source = ".github/workflows/release-plz.yml", commands = ["rust"] },
  { source = ".github/workflows/release.yml", commands = ["rust"] },
]

[proof.repository_contract.executions.rust]
program = "/usr/bin/python3"
directory = "."
timeout_seconds = 300

[proof.repository_contract.executions.rust.environment]
PATH = "/private/tmp/jalapeno-proof-v1/rust/bin"
